<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dobrikov Coach</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ И ЖЕСТКИЙ FLEXBOX */
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #111; color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Запрещаем дергание экрана */
        }
        .app-container {
            display: flex; flex-direction: column; height: 100vh;
        }
        
        /* ВКЛАДКИ */
        .tab-content {
            flex-grow: 1; display: none; overflow-y: auto; flex-direction: column; padding: 15px;
        }
        .tab-content.active {
            display: flex;
        }
        
        /* НИЖНЕЕ МЕНЮ (Мертво закреплено внизу) */
        .bottom-nav {
            display: flex; background-color: #050505; border-top: 1px solid #333; padding: 10px 0;
            flex-shrink: 0;
        }
        .nav-btn {
            flex: 1; text-align: center; color: #666; cursor: pointer; padding: 5px; font-size: 14px; font-weight: bold;
        }
        .nav-btn.active { color: #f1c40f; } /* Золотой цвет активной вкладки */

        /* ЧАТ */
        .chat-box { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 15px; max-width: 85%; line-height: 1.4; font-size: 15px; }
        .msg-user { background-color: #f1c40f; color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: bold; }
        .msg-bot { background-color: #222; color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
        
        /* ПОЛЕ ВВОДА В ЧАТЕ */
        .input-area {
            display: flex; gap: 10px; flex-shrink: 0; padding-bottom: 5px;
        }
        input.chat-input {
            flex-grow: 1; background: #222; border: 1px solid #444; color: #fff; padding: 14px; border-radius: 25px; outline: none; font-size: 15px;
        }
        button.send-btn {
            background: #f1c40f; color: #000; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; font-size: 18px; cursor: pointer;
        }

        /* ПОЛЯ НА ГЛАВНОЙ (БАЗА) */
        .param-label { font-size: 14px; color: #aaa; margin-bottom: 5px; margin-top: 10px; }
        .param-input {
            width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 10px; box-sizing: border-box; font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- ВКЛАДКА: БАЗА -->
        <div id="tab-base" class="tab-content">
            <h2 style="color: #f1c40f; margin-top: 0;">Твоя База</h2>
            <div class="param-label">Вес (кг):</div>
            <input type="text" id="weight" class="param-input" placeholder="Например: 85">
            <div class="param-label">Цель:</div>
            <input type="text" id="goal" class="param-input" placeholder="Например: Сушка, классик физик">
            <div class="param-label">КБЖУ:</div>
            <input type="text" id="calories" class="param-input" placeholder="Например: 2500 ккал">
            <p style="color: #666; font-size: 12px; margin-top: 20px;">Заполни эти данные, ИИ будет опираться на них при составлении плана.</p>
        </div>

        <!-- ВКЛАДКА: ЧАТ -->
        <div id="tab-chat" class="tab-content active">
            <div class="chat-box" id="chat-box">
                <!-- Сюда будут падать сообщения -->
            </div>
            <div class="input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="Написать тренеру...">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- ВКЛАДКА: ВИДЕО (ЗАДЕЛ НА СЛЕДУЮЩИЙ ШАГ) -->
        <div id="tab-video" class="tab-content">
            <h2 style="color: #f1c40f; margin-top: 0;">Анализ Техники</h2>
            <p style="color: #aaa;">Здесь мы реализуем загрузку видео для оценки твоей биомеханики.</p>
        </div>

        <!-- НИЖНЯЯ НАВИГАЦИЯ -->
        <div class="bottom-nav">
            <div class="nav-btn" onclick="switchTab('base', this)">🏠 База</div>
            <div class="nav-btn active" onclick="switchTab('chat', this)">💬 Чат</div>
            <div class="nav-btn" onclick="switchTab('video', this)">📹 Видео</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Элементы
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const weightInput = document.getElementById('weight');
        const goalInput = document.getElementById('goal');
        const caloriesInput = document.getElementById('calories');

        // Переключение вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // Отрисовка сообщения в чате
        function addMessageToUI(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'msg-user' : 'msg-bot');
            
            // Превращаем текст ИИ в красивый HTML (жирный текст и переносы строк)
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            msgDiv.innerHTML = formattedText;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 🔥 ГЛАВНОЕ: Загрузка истории при старте
        async function loadChatHistory() {
            const userId = tg.initDataUnsafe?.user?.id || "123456";
            try {
                let response = await fetch("http://127.0.0.1:8000/get_history", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({user_id: String(userId)})
                });
                let data = await response.json();
                
                // Подтягиваем старые данные в Базу
                if (data.weight) weightInput.value = data.weight;
                if (data.goal) goalInput.value = data.goal;
                if (data.calories) caloriesInput.value = data.calories;

                // Отрисовываем старую переписку
                if (data.history && data.history.length > 0) {
                    data.history.forEach(msg => {
                        addMessageToUI(msg.text, msg.role === "user" ? "user" : "bot");
                    });
                } else {
                    addMessageToUI("Здарова, бро! Тренер на связи. Напиши свои данные в Базе и расскажи, что будем качать сегодня.", "bot");
                }
            } catch (error) {
                console.error("Ошибка загрузки истории:", error);
                addMessageToUI("❌ Ошибка загрузки базы. Убедись, что черный экран терминала Python запущен.", "bot");
            }
        }

        // Отправка нового сообщения
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessageToUI(text, "user");
            chatInput.value = "";

            const userId = tg.initDataUnsafe?.user?.id || "123456";
            const payload = {
                user_id: String(userId),
                weight: weightInput.value || "Не указан",
                goal: goalInput.value || "Без цели",
                calories: caloriesInput.value || "Не указан",
                message: text
            };

            // Индикатор "Тренер печатает..."
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'msg-bot');
            typingDiv.innerText = "Анализирую...";
            typingDiv.id = "typing-indicator";
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                let response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(payload)
                });
                let data = await response.json();
                
                chatBox.removeChild(document.getElementById('typing-indicator'));
                addMessageToUI(data.reply, "bot");
            } catch (error) {
                chatBox.removeChild(document.getElementById('typing-indicator'));
                addMessageToUI("❌ Ошибка связи с сервером.", "bot");
            }
        }

        // Отправка по кнопке Enter
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Запуск подтягивания истории при загрузке страницы
        document.addEventListener("DOMContentLoaded", loadChatHistory);
    </script>
</body>
</html>
