<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobrikov Coach</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1e222d; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { background-color: #2b313f; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); }
        h1 { color: #facc15; font-size: 24px; font-style: italic; margin-bottom: 5px; }
        .subtitle { color: #9ca3af; font-size: 12px; margin-top: 0; margin-bottom: 20px; }
        label { display: block; text-align: left; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #9ca3af; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; background: #1e222d; color: white; box-sizing: border-box; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .row div { width: 50%; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-calc { background: #facc15; color: #1e222d; }
        .btn-back { background: #3b82f6; color: white; }
        .btn-send { background: #facc15; color: #1e222d; margin-bottom: 10px; }
        #result-screen { display: none; }
        .macros { display: flex; justify-content: space-between; margin: 20px 0; }
        .macro-box { background: #1e222d; padding: 10px; border-radius: 10px; width: 30%; font-size: 12px; }
        .macro-value { display: block; font-size: 18px; font-weight: bold; margin-top: 5px; }
        .calories-box { border: 1px solid #facc15; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .calories-value { font-size: 32px; font-weight: bold; color: #facc15; }
    </style>
</head>
<body>
    <div id="main-screen" class="container">
        <h1>DOBRIKOV-COACH</h1>
        <p class="subtitle">Твой ИИ-тренер на связи</p>
        
        <label>ВОЗРАСТ</label>
        <input type="number" id="age" placeholder="Например, 25">
        
        <div class="row">
            <div>
                <label>ВЕС (КГ)</label>
                <input type="number" id="weight" placeholder="80">
            </div>
            <div>
                <label>РОСТ (СМ)</label>
                <input type="number" id="height" placeholder="180">
            </div>
        </div>
        
        <label>ТВОЯ ЦЕЛЬ</label>
        <select id="goal">
            <option value="Рельеф (Поддержание)">⚡ Рельеф (Поддержание)</option>
            <option value="Набор массы">💪 Набор массы</option>
            <option value="Похудение">🔥 Похудение</option>
        </select>
        
        <button class="btn btn-calc" onclick="calculate()">РАССЧИТАТЬ БЖУ</button>
    </div>

    <div id="result-screen" class="container">
        <h1>DOBRIKOV-COACH</h1>
        <p class="subtitle">Твой ИИ-тренер на связи</p>
        <h2>ТВОЙ ПЛАН ГОТОВ, БРО</h2>
        
        <div class="calories-box">
            <div style="font-size: 12px; font-weight: bold;">КАЛЛОРАЖ</div>
            <div class="calories-value"><span id="res-cal">0</span> <span style="font-size: 16px; color: white;">ккал</span></div>
            <div class="macros">
                <div class="macro-box">БЕЛКИ<span class="macro-value"><span id="res-prot">0</span>г</span></div>
                <div class="macro-box">ЖИРЫ<span class="macro-value"><span id="res-fat">0</span>г</span></div>
                <div class="macro-box">УГЛЕВОДЫ<span class="macro-value"><span id="res-carb">0</span>г</span></div>
            </div>
        </div>
        
        <button class="btn btn-send" onclick="sendData()">🚀 ОТПРАВИТЬ ТРЕНЕРУ</button>
        <button class="btn btn-back" onclick="goBack()">НАЗАД К ФОРМЕ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let finalData = {};

        function calculate() {
            let weight = parseFloat(document.getElementById('weight').value);
            let height = parseFloat(document.getElementById('height').value);
            let age = parseFloat(document.getElementById('age').value);
            let goal = document.getElementById('goal').value;

            if (!weight || !height || !age) {
                tg.showAlert("Бро, заполни все поля!");
                return;
            }

            let bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            let tdee = bmr * 1.55; 

            if (goal.includes("Похудение")) {
                tdee -= 400;
            } else if (goal.includes("Набор")) {
                tdee += 400;
            }

            let cal = Math.round(tdee);
            let prot = Math.round(weight * 2.2);
            let fats = Math.round(weight * 0.8);
            let carbs = Math.round((cal - (prot * 4) - (fats * 9)) / 4);

            document.getElementById('res-cal').innerText = cal;
            document.getElementById('res-prot').innerText = prot;
            document.getElementById('res-fat').innerText = fats;
            document.getElementById('res-carb').innerText = carbs;

            finalData = {
                weight: weight,
                goal: goal,
                calories: cal,
                protein: prot,
                fats: fats,
                carbs: carbs
            };

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
        }

        function goBack() {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
        }

        function sendData() {
            tg.sendData(JSON.stringify(finalData));
        }
    </script>
</body>
</html>
