<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dobrikov Coach</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Премиальная цветовая палитра и шрифты */
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --accent: #D4AF37; /* Роскошное золото */
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --glass-bg: rgba(28, 28, 30, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 90px 0; /* Отступ под нижнее меню */
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* Заголовок в стиле Т-Банка */
        .header {
            padding: 24px 20px 10px;
        }
        .header h1 {
            font-size: 28px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header p {
            color: var(--text-muted);
            margin: 6px 0 0;
            font-size: 15px;
        }

        /* Карточки */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active {
            transform: scale(0.98); /* Живой отклик при нажатии */
        }

        /* Поля ввода */
        .input-group {
            margin-bottom: 16px;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        input:focus, select:focus {
            background: #3a3a3c;
            border: 1px solid var(--accent);
        }

        /* Кнопка */
        .btn-main {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-main:active {
            opacity: 0.8;
            transform: scale(0.97);
        }

        /* Жидкое стекло (Glassmorphism) - Нижнее меню */
        .glass-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px; /* Учет полосы iPhone */
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: currentColor;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-item.active svg {
            transform: scale(1.15); /* Плавное увеличение активной иконки */
        }

        /* Вкладки */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .premium-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Вкладка 1: Главная (Расчет) -->
    <div id="tab-home" class="tab-content active">
        <div class="header">
            <h1>Dobrikov Coach</h1>
            <p>Твой персональный ИИ-наставник</p>
        </div>

        <div class="card">
            <span class="premium-badge">⚡ PRO АНАЛИЗ</span>
            <div class="input-group">
                <label>Твой вес (кг)</label>
                <input type="number" id="weight" placeholder="Например: 80" />
            </div>
            <div class="input-group">
                <label>Главная цель</label>
                <select id="goal">
                    <option value="Похудение">🔥 Сушка (Сжечь жир)</option>
                    <option value="Набор массы">💪 Набор чистой массы</option>
                    <option value="Поддержание">⚖️ Рельеф и поддержка</option>
                </select>
            </div>
            <div class="input-group">
                <label>КБЖУ (Ккал / Белки / Жиры / Углеводы)</label>
                <input type="text" id="calories" placeholder="Например: 2500 / 150 / 80 / 300" />
            </div>
            <button class="btn-main" onclick="sendDataToBot()">
                Получить план от ИИ
            </button>
        </div>
    </div>

    <!-- Вкладка 2: Анализ Видео (Заглушка для будущей фичи) -->
    <div id="tab-video" class="tab-content">
        <div class="header">
            <h1>ИИ Видео-анализ</h1>
            <p>Проверка техники нейросетью</p>
        </div>
        <div class="card" style="text-align: center; padding: 40px 20px;">
            <svg style="width: 50px; height: 50px; fill: var(--accent); margin-bottom: 15px;" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM15 16H5V8h10v8z"/></svg>
            <h3 style="margin: 0 0 10px 0;">Сними подход</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin: 0 0 20px 0;">Загрузи видео, и Dobrikov-coach разберет твои ошибки в биомеханике.</p>
            <button class="btn-main" style="background: var(--input-bg); color: var(--text-main);">Скоро в обновлении 🚀</button>
        </div>
    </div>

    <!-- Нижнее меню (Жидкое стекло) -->
    <div class="glass-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <!-- Иконка Домика -->
            <svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
            Главная
        </div>
        <div class="nav-item" onclick="switchTab('video', this)">
            <!-- Иконка Камеры/Анализа -->
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            Видео-разбор
        </div>
        <div class="nav-item" onclick="tg.close()">
            <!-- Иконка Крестика/Закрыть -->
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            Закрыть
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем на весь экран сразу
        
        // Красим верхнюю панель Telegram в цвет нашего приложения
        tg.setHeaderColor('#000000'); 
        tg.setBackgroundColor('#000000');

        // Функция переключения вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
            
            // Легкая вибрация при переключении (если поддерживается)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Функция отправки данных
        function sendDataToBot() {
            let weight = document.getElementById("weight").value;
            let goal = document.getElementById("goal").value;
            let calories = document.getElementById("calories").value;

            if (!weight || !calories) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Бро, заполни все поля!");
                return;
            }

            let data = {
                weight: weight,
                goal: goal,
                calories: calories
            };

            // Вибрация успеха перед отправкой
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            // Отправляем данные в бота
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
